<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Android App Multi-Language Support"</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <h1 id="site-title" class="site-title">Android App Multi-Language Support"</h1>

      <div class="controls" role="region" aria-label="App controls">
        <label for="lang-select" class="visually-hidden">Select language</label>
        <select id="lang-select" aria-label="Select language">
          <option value="en-US">English (US)</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="es">Español</option>
        </select>

        <button id="theme-toggle" class="theme-toggle" aria-pressed="true" aria-label="Toggle dark mode">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.76 4.84l-1.8-1.79L3.17 4.84l1.79 1.8 1.8-1.8zM1 13h3v-2H1v2zm10 9h2v-3h-2v3zm7.03-2.03l1.79 1.79 1.79-1.79-1.79-1.79-1.79 1.79zM20 11v2h3v-2h-3zM4.22 19.78l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79zM12 6a6 6 0 100 12 6 6 0 000-12zM18.36 5.64l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container" role="main" aria-labelledby="main-heading">
    <h2 id="main-heading" class="sr-only">Main content</h2>

    <section class="hero" aria-labelledby="hero-title">
      <h2 id="hero-title" class="hero-title">Hello, welcome!</h2>
      <p id="hero-desc" class="hero-desc">This demo shows a simple multi-language, accessible, responsive page with dark/light mode.</p>

      <div class="translator" aria-labelledby="translator-title">
        <h3 id="translator-title" class="sr-only">Translator</h3>

        <label for="input-text" class="visually-hidden">Text to translate</label>
        <textarea id="input-text" class="input-text" rows="6" placeholder="Type or paste text here"></textarea>

        <div class="translate-controls" role="group" aria-label="Translation directions">
        </div>

        <div class="actions">
          <button id="translate-btn" class="btn" aria-live="polite">Translate with Google (or AI fallback)</button>
        </div>
      </div>
    </section>

    <section class="result" aria-labelledby="result-title">
      <h3 id="result-title" class="result-title">Translated text:</h3>
      <div id="translated-text" class="translated-text" aria-live="polite" role="region" aria-label="Translated text area"></div>
      <div id="translate-meta" class="translate-meta" aria-hidden="true"></div>
    </section>

    <footer class="site-footer" role="contentinfo">
      <p id="footer-text">© <span id="year"></span> Developed by Nivaldo Beirão</p>
    </footer>
  </main>

  <script src="./src/script.js" defer></script>
</body>
</html>
